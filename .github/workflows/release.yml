name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/Dotty/Dotty.csproj'
  SOLUTION_PATH: 'Dotty.slnx'

jobs:
  validate-release:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate tag and build inputs
        id: validate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"

            if [ "${{ github.ref_type }}" != "tag" ] || [ "${{ github.ref_name }}" != "$TAG_NAME" ]; then
              echo "workflow_dispatch releases must run against the matching tag ref ($TAG_NAME)." >&2
              exit 1
            fi
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match semver, e.g. v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          PRERELEASE=false
          if [[ "$VERSION" =~ - ]]; then
            PRERELEASE=true
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build native pty-helper
        working-directory: src/Dotty.NativePty
        run: make

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run Linux release validation tests
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            tests/Dotty.App.Tests/Dotty.App.Tests.csproj \
            tests/Dotty.Terminal.Tests/Dotty.Terminal.Tests.csproj \
            tests/Dotty.App.SkiaTests/Dotty.App.SkiaTests.csproj \
            tests/Dotty.Config.SourceGenerator.Tests/Dotty.Config.SourceGenerator.Tests.csproj; do
            dotnet test --project "$project" -c Release --no-build
          done
          dotnet test --project tests/Dotty.NativePty.Tests/Dotty.NativePty.Tests.csproj \
            -c Release --no-build

  # Build for Linux x64
  build-linux:
    name: Build Linux x64
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-linux-
            nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build native pty-helper
        working-directory: src/Dotty.NativePty
        run: make

      - name: Publish self-contained
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:RequireUnixPtyHelper=true \
            -o ./publish/linux-x64

      - name: Verify Linux artifact
        run: |
          test -x ./publish/linux-x64/dotty
          test -x ./publish/linux-x64/pty-helper

      - name: Create tarball
        run: |
          VERSION=${{ needs.validate-release.outputs.version }}
          cd ./publish/linux-x64
          PACKAGE_DIR="dotty-${VERSION}-linux-x64"
          mkdir -p "../../${PACKAGE_DIR}"
          cp -R * "../../${PACKAGE_DIR}/"
          tar -czf "../../${PACKAGE_DIR}.tar.gz" -C ../.. "${PACKAGE_DIR}"
          rm -rf "../../${PACKAGE_DIR}"
          cd ../..
          ls -la *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotty-linux-x64
          path: dotty-*.tar.gz
          retention-days: 1

  # Build for macOS (Intel and Apple Silicon)
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: osx-x64
            runner: macos-15-intel
          - arch: arm64
            rid: osx-arm64
            runner: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ matrix.arch }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-macos-${{ matrix.arch }}-
            nuget-macos-
            nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build native pty-helper
        working-directory: src/Dotty.NativePty
        run: make

      - name: Publish self-contained
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:RequireUnixPtyHelper=true \
            -o ./publish/${{ matrix.rid }}

      - name: Verify macOS artifact
        run: |
          test -x ./publish/${{ matrix.rid }}/dotty
          test -x ./publish/${{ matrix.rid }}/pty-helper

      - name: Create tarball
        run: |
          VERSION=${{ needs.validate-release.outputs.version }}
          cd ./publish/${{ matrix.rid }}
          PACKAGE_DIR="dotty-${VERSION}-${{ matrix.rid }}"
          mkdir -p "../../${PACKAGE_DIR}"
          cp -R * "../../${PACKAGE_DIR}/"
          tar -czf "../../${PACKAGE_DIR}.tar.gz" -C ../.. "${PACKAGE_DIR}"
          rm -rf "../../${PACKAGE_DIR}"
          cd ../..
          ls -la *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotty-${{ matrix.rid }}
          path: dotty-*.tar.gz
          retention-days: 1

  # Build for Windows x64
  build-windows:
    name: Build Windows x64
    needs: validate-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-windows-
            nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Publish self-contained
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o .\publish\win-x64
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          if (!(Test-Path "publish\win-x64\dotty.exe")) {
            throw "Published executable dotty.exe is missing."
          }
          if (!(Test-Path "publish\win-x64\libSkiaSharp.dll")) {
            throw "Windows SkiaSharp native asset is missing."
          }

      - name: Create zip archive
        run: |
          $version = "${{ needs.validate-release.outputs.version }}"
          Compress-Archive -Path "publish\win-x64\*" -DestinationPath "dotty-$version-win-x64.zip" -Force
          Get-ChildItem *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotty-win-x64
          path: dotty-*.zip
          retention-days: 1

  smoke-release-assets:
    name: Smoke release archives
    needs: [validate-release, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: dotty-*

      - name: Verify every archive
        shell: bash
        run: |
          set -euo pipefail
          archive_count="$(find ./artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          test "$archive_count" -eq 4
          for archive in ./artifacts/*/*.tar.gz; do
            [ -f "$archive" ] || continue
            listing="$(tar -tzf "$archive")"
            printf '%s\n' "$listing" | grep -Eq '/dotty$'
            printf '%s\n' "$listing" | grep -Eq '/pty-helper$'
          done
          for archive in ./artifacts/*/*.zip; do
            [ -f "$archive" ] || continue
            listing="$(unzip -Z1 "$archive")"
            printf '%s\n' "$listing" | grep -Eq '(^|/)dotty\.exe$'
          done
  # Create GitHub Release
  create-release:
    name: Create Release
    needs: [validate-release, build-linux, build-macos, build-windows, smoke-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: dotty-*

      - name: Collect artifacts
        run: |
          mkdir -p ./release-assets
          find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} ./release-assets/ \;
          ls -la ./release-assets/
      - name: Smoke extracted Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find ./release-assets -name 'dotty-*-linux-x64.tar.gz' -print -quit)"
          test -n "$archive"
          smoke_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$smoke_dir"
          package_dir="$(find "$smoke_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$package_dir"
          test -x "$package_dir/dotty"
          test -x "$package_dir/pty-helper"
          set +e
          timeout 10s env HOME="$smoke_dir/home" XDG_CONFIG_HOME="$smoke_dir/home/.config" \
            DOTTY_CONFIG_HOME="$smoke_dir/home/.config/dotty" \
            xvfb-run -a "$package_dir/dotty" > "$smoke_dir/smoke.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$smoke_dir/smoke.log"
            exit 1
          fi

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ needs.validate-release.outputs.version }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          cat > RELEASE_NOTES.md <<EOF
          ## Dotty Terminal v${VERSION}

          ### Installation

          **Linux (x64):**
          ```bash
          tar -xzf dotty-${VERSION}-linux-x64.tar.gz
          cd dotty-${VERSION}-linux-x64
          ./dotty
          ```

          **macOS (Intel x64):**
          ```bash
          tar -xzf dotty-${VERSION}-osx-x64.tar.gz
          cd dotty-${VERSION}-osx-x64
          ./dotty
          ```

          **macOS (Apple Silicon):**
          ```bash
          tar -xzf dotty-${VERSION}-osx-arm64.tar.gz
          cd dotty-${VERSION}-osx-arm64
          ./dotty
          ```

          **Windows (x64):**
          1. Extract `dotty-${VERSION}-win-x64.zip`
          2. Run `dotty.exe`

          ### System Requirements
          - Linux: kernel 3.10+, glibc 2.17+
          - macOS: 10.15+ (Catalina or later)
          - Windows: Windows 10 1809+ or Windows 11

          ### Checksums
          EOF
          
          # Generate a deterministic artifact manifest and checksums.
          (
            cd ./release-assets
            printf '%s\n' *.tar.gz *.zip | sort
          ) > ARTIFACT_MANIFEST.txt
          (
            cd ./release-assets
            sha256sum *.tar.gz *.zip
          ) > CHECKSUMS.txt
          cp ARTIFACT_MANIFEST.txt ./release-assets/MANIFEST.txt
          cp CHECKSUMS.txt ./release-assets/SHA256SUMS
          cat CHECKSUMS.txt >> RELEASE_NOTES.md
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate-release.outputs.tag_name }}
          name: Dotty v${{ steps.release_notes.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ./release-assets/*
          draft: false
          prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums as artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: CHECKSUMS.txt
          retention-days: 30
