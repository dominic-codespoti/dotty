name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release tag (e.g., v0.3.0 or v0.4.0-beta.1)'
        required: true

env:
  DOTNET_VERSION: '11.0.x'
  PROJECT_PATH: 'src/Dotty/Dotty.csproj'
  SOLUTION_PATH: 'Dotty.slnx'

# Least privilege: read-only by default; only create-release gets write, OIDC and attestation scopes.
permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Validate tag and build inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"

            if [ "${{ github.ref_type }}" != "tag" ] || [ "${{ github.ref_name }}" != "$TAG_NAME" ]; then
              echo "workflow_dispatch releases must run against the matching tag ref ($TAG_NAME)." >&2
              exit 1
            fi
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match semver, e.g. v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          PRERELEASE=false
          if [[ "$VERSION" =~ - ]]; then
            PRERELEASE=true
          fi

          CENTRAL_VERSION=$(dotnet msbuild "${{ env.PROJECT_PATH }}" -getProperty:Version -nologo)
          if [ "$VERSION" != "$CENTRAL_VERSION" ]; then
            echo "Release tag version $VERSION does not match centrally evaluated MSBuild Version $CENTRAL_VERSION." >&2
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "central_version=$CENTRAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build native pty-helper
        working-directory: src/Dotty.NativePty
        run: make

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run Linux release validation tests
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            tests/Dotty.App.Tests/Dotty.App.Tests.csproj \
            tests/Dotty.Terminal.Tests/Dotty.Terminal.Tests.csproj \
            tests/Dotty.App.SkiaTests/Dotty.App.SkiaTests.csproj; do
            dotnet test --project "$project" -c Release --no-build
          done
          dotnet test --project tests/Dotty.NativePty.Tests/Dotty.NativePty.Tests.csproj \
            -c Release --no-build

  # NativeAOT publish, verification and archives for every release RID: the same reusable
  # workflow CI runs on every push and pull request, here with the exact release version.
  build:
    name: Build release archives
    needs: validate-release
    uses: ./.github/workflows/aot-publish.yml
    with:
      version: ${{ needs.validate-release.outputs.version }}

  smoke-release-assets:
    name: Smoke release archives
    needs: [validate-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts
          pattern: dotty-*

      - name: Verify every archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          python3 scripts/dist/verify_archive.py --expect-count 4 ./artifacts/*/*.tar.gz ./artifacts/*/*.zip

      - name: Install Xvfb and software OpenGL (Mesa llvmpipe)
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Render a frame from the extracted Linux archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find ./artifacts -name 'dotty-*-linux-x64.tar.gz' -print -quit)"
          test -n "$archive"
          smoke_dir="$RUNNER_TEMP/release-smoke"
          mkdir -p "$smoke_dir"
          tar -xzf "$archive" -C "$smoke_dir"
          package_dir="$smoke_dir/$(basename "$archive" .tar.gz)"
          # desktop-smoke.py drives the loopback control interface (DOTTY_TEST_PORT): it fails unless
          # the window presents frames, the child shell's output renders, and resize and split work.
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x800x24 +extension GLX +render -noreset' \
            python3 scripts/native/desktop-smoke.py --backend x11 --executable "$package_dir/dotty"

  create-release:
    name: Create Release
    needs: [validate-release, build, smoke-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation (Sigstore OIDC)
      attestations: write # store the provenance attestation
    env:
      VERSION: ${{ needs.validate-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts
          pattern: dotty-*

      - name: Collect archives, baselines, manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p ./release-assets
          cp ./artifacts/*/*.tar.gz ./artifacts/*/*.zip ./release-assets/
          python3 scripts/dist/check_baseline.py merge --output ./release-assets/baselines.json ./artifacts/*/baselines-*.json
          cd ./release-assets
          printf '%s\n' *.tar.gz *.zip | sort > MANIFEST.txt
          sha256sum *.tar.gz *.zip baselines.json > SHA256SUMS
          ls -la

      - name: Generate release notes from measured baselines
        run: python3 scripts/dist/release_notes.py --version "$VERSION" --repository "${{ github.repository }}" --baselines ./release-assets/baselines.json --checksums ./release-assets/SHA256SUMS --output RELEASE_NOTES.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./release-assets/*.tar.gz
            ./release-assets/*.zip
            ./release-assets/baselines.json

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate-release.outputs.tag_name }}
          name: Dotty v${{ needs.validate-release.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ./release-assets/*
          draft: false
          prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: ./release-assets/SHA256SUMS
          retention-days: 30
