name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release tag (e.g., v0.3.0 or v0.4.0-beta.1)'
        required: true

env:
  DOTNET_VERSION: '11.0.x'
  PROJECT_PATH: 'src/Dotty/Dotty.csproj'
  SOLUTION_PATH: 'Dotty.slnx'

jobs:
  validate-release:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Validate tag and build inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"

            if [ "${{ github.ref_type }}" != "tag" ] || [ "${{ github.ref_name }}" != "$TAG_NAME" ]; then
              echo "workflow_dispatch releases must run against the matching tag ref ($TAG_NAME)." >&2
              exit 1
            fi
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match semver, e.g. v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          PRERELEASE=false
          if [[ "$VERSION" =~ - ]]; then
            PRERELEASE=true
          fi

          CENTRAL_VERSION=$(dotnet msbuild "${{ env.PROJECT_PATH }}" -getProperty:Version -nologo)
          if [ "$VERSION" != "$CENTRAL_VERSION" ]; then
            echo "Release tag version $VERSION does not match centrally evaluated MSBuild Version $CENTRAL_VERSION." >&2
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "central_version=$CENTRAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build native pty-helper
        working-directory: src/Dotty.NativePty
        run: make

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run Linux release validation tests
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            tests/Dotty.App.Tests/Dotty.App.Tests.csproj \
            tests/Dotty.Terminal.Tests/Dotty.Terminal.Tests.csproj \
            tests/Dotty.App.SkiaTests/Dotty.App.SkiaTests.csproj; do
            dotnet test --project "$project" -c Release --no-build
          done
          dotnet test --project tests/Dotty.NativePty.Tests/Dotty.NativePty.Tests.csproj \
            -c Release --no-build

  # NativeAOT publish, verification and archives for every release RID: the same reusable
  # workflow CI runs on every push and pull request, here with the exact release version.
  build:
    name: Build release archives
    needs: validate-release
    uses: ./.github/workflows/aot-publish.yml
    with:
      version: ${{ needs.validate-release.outputs.version }}

  smoke-release-assets:
    name: Smoke release archives
    needs: [validate-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: dotty-*

      - name: Verify every archive
        shell: bash
        run: |
          set -euo pipefail
          archive_count="$(find ./artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          test "$archive_count" -eq 4
          for archive in ./artifacts/*/*.tar.gz; do
            [ -f "$archive" ] || continue
            listing="$(tar -tzf "$archive")"
            printf '%s\n' "$listing" | grep -Eq '/dotty$'
            printf '%s\n' "$listing" | grep -Eq '/libglfw(\.so\.3|\.3\.dylib)$'
            printf '%s\n' "$listing" | grep -Eq '/libSkiaSharp\.(so|dylib)$'
            printf '%s\n' "$listing" | grep -Eq '/liblua54\.(so|dylib)$'
            printf '%s\n' "$listing" | grep -Eq '/pty-helper$'
            printf '%s\n' "$listing" | grep -Eq '/shell-integration/dotty\.bash$'
            printf '%s\n' "$listing" | grep -Eq '/shell-integration/inject/bash/dotty-rcfile\.bash$'
            printf '%s\n' "$listing" | grep -Eq '/shell-integration/inject/zsh/\.zshenv$'
            printf '%s\n' "$listing" | grep -Eq '/shell-integration/inject/xdg/fish/vendor_conf\.d/dotty-shell-integration\.fish$'
          done
          for archive in ./artifacts/*/*.zip; do
            [ -f "$archive" ] || continue
            listing="$(unzip -Z1 "$archive")"
            printf '%s\n' "$listing" | grep -Eq '(^|/)dotty\.exe$'
            printf '%s\n' "$listing" | grep -Eq '(^|/)glfw3\.dll$'
            printf '%s\n' "$listing" | grep -Eq '(^|/)libSkiaSharp\.dll$'
            printf '%s\n' "$listing" | grep -Eq '(^|/)lua54\.dll$'
            printf '%s\n' "$listing" | grep -Eq '(^|[/\\])shell-integration[/\\]Dotty\.ps1$'
            printf '%s\n' "$listing" | grep -Eq '(^|[/\\])shell-integration[/\\]inject[/\\]bash[/\\]dotty-rcfile\.bash$'
          done
  # Create GitHub Release
  create-release:
    name: Create Release
    needs: [validate-release, build, smoke-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: dotty-*

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./release-assets
          find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} ./release-assets/ \;
          ls -la ./release-assets/
      - name: Smoke extracted Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find ./release-assets -name 'dotty-*-linux-x64.tar.gz' -print -quit)"
          test -n "$archive"
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/home"
          tar -xzf "$archive" -C "$smoke_dir"
          package_dir="$(find "$smoke_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$package_dir"
          test -x "$package_dir/dotty"
          test -x "$package_dir/pty-helper"
          test -f "$package_dir/shell-integration/dotty.bash"
          test -f "$package_dir/shell-integration/inject/zsh/.zshenv"
          set +e
          timeout 10s env HOME="$smoke_dir/home" DOTNET_CLI_HOME="$smoke_dir/home" XDG_CONFIG_HOME="$smoke_dir/home/.config" \
            DOTTY_CONFIG_HOME="$smoke_dir/home/.config/dotty" \
            xvfb-run -a "$package_dir/dotty" > "$smoke_dir/smoke.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$smoke_dir/smoke.log"
            exit 1
          fi

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ needs.validate-release.outputs.version }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          cat > RELEASE_NOTES.md <<EOF
          ## Dotty Terminal v${VERSION}

          ### Installation

          **Linux (x64):**
          ```bash
          tar -xzf dotty-${VERSION}-linux-x64.tar.gz
          cd dotty-${VERSION}-linux-x64
          ./dotty
          ```

          **macOS (Intel x64):**
          ```bash
          tar -xzf dotty-${VERSION}-osx-x64.tar.gz
          cd dotty-${VERSION}-osx-x64
          ./dotty
          ```

          **macOS (Apple Silicon):**
          ```bash
          tar -xzf dotty-${VERSION}-osx-arm64.tar.gz
          cd dotty-${VERSION}-osx-arm64
          ./dotty
          ```

          **Windows (x64):**
          1. Extract `dotty-${VERSION}-win-x64.zip`
          2. Run `dotty.exe`

          ### System Requirements
          - Linux: kernel 3.10+, glibc 2.17+
          - macOS: 10.15+ (Catalina or later)
          - Windows: Windows 10 1809+ or Windows 11

          ### Checksums
          EOF
          
          # Generate a deterministic artifact manifest and checksums.
          (
            cd ./release-assets
            printf '%s\n' *.tar.gz *.zip | sort
          ) > ARTIFACT_MANIFEST.txt
          (
            cd ./release-assets
            sha256sum *.tar.gz *.zip
          ) > CHECKSUMS.txt
          cp ARTIFACT_MANIFEST.txt ./release-assets/MANIFEST.txt
          cp CHECKSUMS.txt ./release-assets/SHA256SUMS
          cat CHECKSUMS.txt >> RELEASE_NOTES.md
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-release.outputs.tag_name }}
          name: Dotty v${{ steps.release_notes.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ./release-assets/*
          draft: false
          prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums as artifact
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: CHECKSUMS.txt
          retention-days: 30
