name: Recalibrate Perf Baselines

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Benchmark category filter (substring match; use parser memory rendering silk startup throughput bulk for all categories; empty resolves to this default)'
        required: false
        default: 'parser memory rendering silk startup throughput bulk'
      commit:
        description: 'Commit updated baselines.json back to the branch'
        required: false
        default: 'true'

env:
  DOTNET_VERSION: '11.0.x'
  SOLUTION_PATH: 'Dotty.slnx'

jobs:
  recalibrate:
    name: Recalibrate Baselines (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev && dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Measure baselines
        shell: bash
        run: |
          set -euo pipefail
          cd tests/Dotty.Performance.Tests
          if [ -n "${{ inputs.filter }}" ]; then
            dotnet run -c Release --no-build -- --mode update-baselines --filter "${{ inputs.filter }}"
          else
            dotnet run -c Release --no-build -- --mode update-baselines
          fi

      - name: Upload fresh baselines
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recalibrated-baselines
          path: ${{ github.workspace }}/tests/Dotty.Performance.Tests/baselines.json
          retention-days: 30
          if-no-files-found: error

      - name: Commit baselines back
        if: inputs.commit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Dotty.Performance.Tests/baselines.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "Recalibrate perf baselines on ubuntu-latest runner"
          git push origin "HEAD:${{ github.ref_name }}"
