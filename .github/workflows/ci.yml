name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/instructions/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/instructions/**'

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/Dotty/Dotty.csproj'
  SOLUTION_PATH: 'Dotty.slnx'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            build-native: true
          - os: windows-latest
            rid: win-x64
            build-native: false
          - os: macos-15-intel
            rid: osx-x64
            build-native: true
          - os: macos-15
            rid: osx-arm64
            build-native: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ matrix.os }}-
            nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build native pty-helper (Unix only)
        if: matrix.build-native
        working-directory: src/Dotty.NativePty
        run: make

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Validate host RID
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet restore "${{ env.PROJECT_PATH }}" -r "$RID"
          dotnet publish "${{ env.PROJECT_PATH }}" \
            -c Release \
            -r "$RID" \
            --self-contained false \
            -p:PublishAot=false \
            -p:PublishTrimmed=false \
            --no-restore \
            -o ".ci-publish/$RID"
      - name: Verify published native assets
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          case "$RID" in
            linux-*)
              test -x ".ci-publish/$RID/dotty"
              test -f ".ci-publish/$RID/libSkiaSharp.so"
              test -f ".ci-publish/$RID/liblua54.so"
              test -x ".ci-publish/$RID/pty-helper"
              ;;
            osx-*)
              test -x ".ci-publish/$RID/dotty"
              test -f ".ci-publish/$RID/libSkiaSharp.dylib"
              test -f ".ci-publish/$RID/liblua54.dylib"
              test -x ".ci-publish/$RID/pty-helper"
              ;;
            win-*)
              test -f ".ci-publish/$RID/dotty.exe"
              test -f ".ci-publish/$RID/libSkiaSharp.dll"
              ;;
            *)
              echo "Unsupported validation RID: $RID" >&2
              exit 1
              ;;
          esac

      - name: Run host-native tests
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          for project in \
            tests/Dotty.App.Tests/Dotty.App.Tests.csproj \
            tests/Dotty.Terminal.Tests/Dotty.Terminal.Tests.csproj \
            tests/Dotty.App.SkiaTests/Dotty.App.SkiaTests.csproj \
            tests/Dotty.Config.SourceGenerator.Tests/Dotty.Config.SourceGenerator.Tests.csproj; do
            project_name="$(basename "$project" .csproj)"
            dotnet test --project "$project" \
              -c Release \
              --no-build \
              --report-xunit-trx \
              --report-xunit-trx-filename "${project_name}-${RID}.trx" \
              --results-directory "./TestResults/$RID"
          done
      - name: Run native PTY smoke
        run: dotnet test --project tests/Dotty.NativePty.Tests/Dotty.NativePty.Tests.csproj -c Release --no-build --report-xunit-trx --report-xunit-trx-filename "native-${{ matrix.rid }}.trx" --results-directory ./TestResults/${{ matrix.rid }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            src/Dotty/bin/Release/
            src/Dotty.NativePty/bin/
            .ci-publish/
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            **/test-results.trx
          retention-days: 5
          if-no-files-found: ignore

  gui-smoke-linux:
    name: GUI Smoke (X11 and Wayland)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GUI smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y weston xvfb

      - name: Restore and build
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}"
          make -C src/Dotty.NativePty
          dotnet build "${{ env.PROJECT_PATH }}" -c Release --no-restore

      - name: Smoke X11 desktop startup
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          set +e
          timeout 12s env HOME="$smoke_dir/home" XDG_CONFIG_HOME="$smoke_dir/home/.config" \
            DOTTY_CONFIG_HOME="$smoke_dir/home/.config/dotty" \
            xvfb-run -a dotnet run --project "${{ env.PROJECT_PATH }}" -c Release --no-build \
            > "$smoke_dir/x11.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$smoke_dir/x11.log"
            exit 1
          fi

      - name: Smoke Wayland desktop startup
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$smoke_dir/runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-1 > "$smoke_dir/weston.log" 2>&1 &
          weston_pid=$!
          cleanup() {
            if kill -0 "$weston_pid" 2>/dev/null; then
              kill "$weston_pid"
            fi
          }
          trap cleanup EXIT
          for _ in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-1" ]; then break; fi
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/wayland-1"
          set +e
          timeout 12s env HOME="$smoke_dir/home" XDG_CONFIG_HOME="$smoke_dir/home/.config" \
            DOTTY_CONFIG_HOME="$smoke_dir/home/.config/dotty" WAYLAND_DISPLAY=wayland-1 \
            DISPLAY= GLFW_PLATFORM=wayland \
            dotnet run --project "${{ env.PROJECT_PATH }}" -c Release --no-build \
            > "$smoke_dir/wayland.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$smoke_dir/wayland.log"
            cat "$smoke_dir/weston.log"
            exit 1
          fi

  desktop-smoke:
    name: Desktop Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install GNU timeout (macOS only)
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          if ! command -v gtimeout >/dev/null 2>&1; then
            brew install coreutils
          fi

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build native helper (macOS only)
        if: matrix.os == 'macos-15'
        working-directory: src/Dotty.NativePty
        run: make

      - name: Build desktop host
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release --no-restore

      - name: Smoke desktop startup
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/dotty-desktop-smoke"
          mkdir -p "$smoke_dir/home"
          set +e
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            timeout_cmd=gtimeout
          else
            timeout_cmd=timeout
          fi
          "$timeout_cmd" 12s env HOME="$smoke_dir/home" XDG_CONFIG_HOME="$smoke_dir/home/.config" \
            DOTTY_CONFIG_HOME="$smoke_dir/home/.config/dotty" \
            dotnet run --project "${{ env.PROJECT_PATH }}" -c Release --no-build \
            > "$smoke_dir/desktop.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$smoke_dir/desktop.log"
            exit 1
          fi

  # Job to check code formatting
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Check formatting
        run: dotnet format whitespace ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity detailed

  # Job to run performance benchmarks
  performance-tests:
    name: Performance Tests (Linux)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ubuntu-latest-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-ubuntu-latest-
            nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run Performance Tests
        run: |
          cd tests/Dotty.Performance.Tests
          dotnet run -c Release -- --mode quick
        env:
          CI: true
          DOTTY_BENCH_MODE: quick

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            tests/Dotty.Performance.Tests/BenchmarkDotNet.Artifacts/
            tests/Dotty.Performance.Tests/baselines.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Check for Performance Regressions
        run: |
          # Check if regressions were detected
          if [ -f "tests/Dotty.Performance.Tests/regressions.txt" ]; then
            echo "Performance regressions detected:"
            cat tests/Dotty.Performance.Tests/regressions.txt
            exit 1
          fi
          echo "No performance regressions detected."

  # Summary job that depends on all others
  ci-summary:
    name: CI Summary
    needs: [build-and-test, gui-smoke-linux, desktop-smoke, code-quality, performance-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-and-test.result }}" = "failure" ]; then
            echo "Build or tests failed!"
            exit 1
          fi
          
          if [ "${{ needs.code-quality.result }}" = "failure" ]; then
            echo "Code quality checks failed!"
            exit 1
          fi
          
          if [ "${{ needs.performance-tests.result }}" = "failure" ]; then
            echo "Performance tests failed!"
            echo "Check the performance-results artifact for details."
            exit 1
          fi

          if [ "${{ needs.gui-smoke-linux.result }}" = "failure" ]; then
            echo "GUI smoke checks failed!"
            exit 1
          fi
          
          if [ "${{ needs.desktop-smoke.result }}" = "failure" ]; then
            echo "macOS/Windows desktop smoke checks failed!"
            exit 1
          fi
          
          echo "All CI checks passed!"
