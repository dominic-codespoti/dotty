name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/instructions/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/instructions/**'

env:
  DOTNET_VERSION: '11.0.x'
  PROJECT_PATH: 'src/Dotty/Dotty.csproj'
  SOLUTION_PATH: 'Dotty.slnx'

# Least privilege: no job in CI writes to the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            build-native: true
            skip-gpu-tests: false
          - os: windows-latest
            rid: win-x64
            build-native: false
            skip-gpu-tests: false
          - os: macos-15-intel
            rid: osx-x64
            build-native: true
            # GLFW window/GL-context creation hangs indefinitely on macOS CI
            # runners (no active WindowServer session / main-thread run loop)
            # instead of throwing the catchable PlatformNotSupportedException/
            # GlfwException that Linux and Windows raise, which previously
            # burned the full 6h job timeout. Skip until a macOS-specific
            # headless GL fallback exists.
            skip-gpu-tests: true
          - os: macos-15
            rid: osx-arm64
            build-native: true
            skip-gpu-tests: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Install GLFW build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev zsh fish
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ matrix.os }}-
            nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # Directory.Build.props writes packages.lock.json during CI restores and restores in
      # locked mode for every project whose lock file is committed. Until they are committed,
      # the generated files are published here for review (see docs/Releasing.md).
      - name: Upload generated NuGet lock files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-lock-files-${{ matrix.os }}
          path: '**/packages.lock.json'
          retention-days: 7
          if-no-files-found: ignore

      - name: Build native pty-helper (Unix only)
        if: matrix.build-native
        working-directory: src/Dotty.NativePty
        run: make

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run host-native tests
        shell: bash
        timeout-minutes: 15
        env:
          RID: ${{ matrix.rid }}
          SKIP_GPU_TESTS: ${{ matrix.skip-gpu-tests }}
        run: |
          set -euo pipefail
          projects=(
            tests/Dotty.App.Tests/Dotty.App.Tests.csproj
            tests/Dotty.Terminal.Tests/Dotty.Terminal.Tests.csproj
          )
          if [ "$SKIP_GPU_TESTS" != "true" ]; then
            projects+=(tests/Dotty.App.SkiaTests/Dotty.App.SkiaTests.csproj)
          fi
          for project in "${projects[@]}"; do
            project_name="$(basename "$project" .csproj)"
            dotnet test --project "$project" \
              -c Release \
              --no-build \
              --report-xunit-trx \
              --report-xunit-trx-filename "${project_name}-${RID}.trx" \
              --results-directory "./TestResults/$RID"
          done
      - name: Run native PTY smoke
        run: dotnet test --project tests/Dotty.NativePty.Tests/Dotty.NativePty.Tests.csproj -c Release --no-build --report-xunit-trx --report-xunit-trx-filename "native-${{ matrix.rid }}.trx" --results-directory ./TestResults/${{ matrix.rid }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.os }}
          path: |
            src/Dotty/bin/Release/
            src/Dotty.NativePty/bin/
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            **/test-results.trx
          retention-days: 5
          if-no-files-found: ignore

  # Hosted macOS and Windows runners lack a usable OpenGL session; their host-native
  # builds are validated by build-and-test above and their NativeAOT publish output by
  # aot-publish below.
  gui-smoke-linux:
    name: GUI Smoke (X11)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Install GUI smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb cmake pkg-config xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore "${{ env.PROJECT_PATH }}" -r linux-x64
          make -C src/Dotty.NativePty
          dotnet build "${{ env.PROJECT_PATH }}" -c Release -r linux-x64 --no-restore

      - name: Smoke X11 desktop startup
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/home"
          set +e
          timeout 12s env HOME="$smoke_dir/home" DOTNET_CLI_HOME="$smoke_dir/home" \
            XDG_CONFIG_HOME="$smoke_dir/home/.config" \
            DOTTY_CONFIG_HOME="$smoke_dir/home/.config/dotty" \
            xvfb-run -a dotnet run --project "${{ env.PROJECT_PATH }}" -c Release -r linux-x64 --no-build \
            > "$smoke_dir/x11.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$smoke_dir/x11.log"
            exit 1
          fi
      - name: Idle wakeups (X11)
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/home"
          set +e
          env HOME="$smoke_dir/home" DOTNET_CLI_HOME="$smoke_dir/home" \
            XDG_CONFIG_HOME="$smoke_dir/home/.config" \
            DOTTY_CONFIG_HOME="$smoke_dir/home/.config/dotty" \
            python3 scripts/perf/idle_wakeups.py --max-switches-per-s 150 -- xvfb-run -a dotnet run --project "${{ env.PROJECT_PATH }}" -c Release -r linux-x64 --no-build \
            > "$smoke_dir/idle-wakeups.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat "$smoke_dir/idle-wakeups.log"
            exit "$status"
          fi
          cat "$smoke_dir/idle-wakeups.log"

  # NativeAOT publish of every release RID through the reusable workflow that release.yml
  # also calls: file asserts, `dotty --version` and `+explain-config` smoke, a gate that fails
  # on IL2xxx/IL3xxx warnings in Dotty's own code (third-party warnings are listed), and the
  # measured platform baseline (glibc / macOS deployment target) against baseline-targets.json.
  aot-publish:
    name: AOT publish
    uses: ./.github/workflows/aot-publish.yml

  # Job to check code formatting
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Check formatting
        run: dotnet format whitespace ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity detailed

      - name: Run benchmark script tests
        run: python3 -m unittest discover -s scripts/perf/tests

      - name: Run esctest script tests
        run: python3 -m unittest discover -s scripts/esctest/tests

      - name: Run distribution script tests
        run: python3 -m unittest discover -s scripts/dist/tests

      - name: Check generated man page and shell completions are current
        run: python3 scripts/dist/gen_packaging.py --check

      - name: Check THIRD-PARTY-NOTICES.md against the restored NuGet packages
        run: python3 scripts/dist/check_notices.py

      # tools/gen-width-tables.py derives the width tables from Python's unicodedata and refuses
      # any UCD other than 16.0.0. Python 3.14's unicodedata is UCD 16.0.0
      # (docs.python.org/3.14/library/unicodedata.html), so pin 3.14 for this check.
      - name: Setup Python 3.14 (unicodedata 16.0.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Check generated Unicode width tables are current
        run: python3 tools/gen-width-tables.py --check

  # esctest2 conformance (Linux only; esctest needs Unix tty/termios, so no Windows).
  # NOT GATING UNTIL A BASELINE EXISTS: while tests/esctest/expected-failures.txt has no
  # "# baseline-captured:" marker (written by the esctest-baseline workflow's
  # --update-expectations), every step below is continue-on-error and the runner downgrades
  # gate failures to exit 0 ("NOT GATING" in its output and the step summary). Once the
  # marker is committed the same steps gate on regressions, unexpected passes, stale
  # entries, hangs and harness faults.
  esctest-linux:
    name: esctest conformance (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect captured baseline
        id: baseline
        shell: bash
        run: |
          if grep -Eq '^#[[:space:]]*baseline-captured:[[:space:]]*[0-9a-f]+' tests/esctest/expected-failures.txt; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
            echo "esctest baseline captured: gating."
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::esctest has no captured baseline yet; results are reported but do not gate."
          fi

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        continue-on-error: ${{ steps.baseline.outputs.captured != 'true' }}
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-esctest-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-esctest-

      - name: Cache esctest2 checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .esctest
          key: esctest2-${{ hashFiles('tests/esctest/esctest.json') }}

      - name: Python version
        run: python3 --version

      - name: Build native pty-helper
        continue-on-error: ${{ steps.baseline.outputs.captured != 'true' }}
        run: make -C src/Dotty.NativePty

      - name: Build conformance host
        continue-on-error: ${{ steps.baseline.outputs.captured != 'true' }}
        run: |
          dotnet restore tests/Dotty.Conformance.Host/Dotty.Conformance.Host.csproj
          dotnet build tests/Dotty.Conformance.Host/Dotty.Conformance.Host.csproj -c Release --no-restore

      - name: Run esctest2
        # Shorter than the job cap so a pre-baseline hang is a tolerated step failure, not a failed (red) job.
        timeout-minutes: 20
        continue-on-error: ${{ steps.baseline.outputs.captured != 'true' }}
        run: python3 scripts/esctest/run_esctest.py --jobs 2 --out artifacts/esctest

      - name: Upload esctest results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: esctest-results
          path: artifacts/esctest/
          retention-days: 14
          if-no-files-found: warn

  # Job to run performance benchmarks
  performance-tests:
    name: Performance Tests (Linux)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-ubuntu-latest-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-ubuntu-latest-
            nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev && dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run Performance Tests
        shell: bash
        run: |
          set -euo pipefail
          cd tests/Dotty.Performance.Tests
          dotnet run -c Release -- --mode quick
        env:
          CI: true
          DOTTY_BENCH_MODE: quick

      - name: Upload Performance Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance-results
          path: |
            tests/Dotty.Performance.Tests/BenchmarkDotNet.Artifacts/
            tests/Dotty.Performance.Tests/baselines.json
          retention-days: 30
          if-no-files-found: ignore

  # Summary job that depends on all others
  ci-summary:
    name: CI Summary
    needs: [build-and-test, aot-publish, gui-smoke-linux, code-quality, performance-tests, esctest-linux]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.build-and-test.result }}" = "failure" ]; then
            echo "Build or tests failed!"
            exit 1
          fi

          if [ "${{ needs.aot-publish.result }}" = "failure" ]; then
            echo "NativeAOT publish, its file/version smoke, or the own-code IL warning gate failed!"
            exit 1
          fi
          
          if [ "${{ needs.code-quality.result }}" = "failure" ]; then
            echo "Code quality checks failed!"
            exit 1
          fi
          
          if [ "${{ needs.performance-tests.result }}" = "failure" ]; then
            echo "Performance tests failed!"
            echo "Check the performance-results artifact for details."
            exit 1
          fi

          if [ "${{ needs.gui-smoke-linux.result }}" = "failure" ]; then
            echo "GUI smoke checks failed!"
            exit 1
          fi
          if [ "${{ needs.esctest-linux.result }}" = "failure" ]; then
            echo "esctest conformance regression; see the esctest-results artifact."
            exit 1
          fi
          echo "All CI checks passed!"
